<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="description" content="实用小工具合集" />
  <meta name="theme-color" content="#0b1320" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>DevTools</title>
  <script>try{if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)document.documentElement.classList.add('is-pwa-standalone')}catch(e){}</script>
  <script src="./lib/tools-build.js?v=2026.09.06-083100"></script>
  <link rel="stylesheet" href="./style.css?v=2026.09.06-083100" />
  <link rel="stylesheet" href="./workspace-nav.css?v=2026.09.06-083100" />
  <link rel="stylesheet" href="./styles/bridge-shell.css?v=2026.09.06-083100" />
  <script src="./lib/theme-presets.js?v=2026.09.06-083100"></script>
  <script src="./lib/boot-loader.js?v=2026.09.06-083100"></script>
  <script>
  (function(){
    try{
      var raw=String(location.hash||'').replace(/^#/,'').trim();
      var head=raw.split(/[/?]/)[0]||'';
      var last=localStorage.getItem('devtools-tool-last-v1');
      var id='timestamp';
      if(head&&head!=='timestamp')id=head;else if(last&&last!=='timestamp')id=last;
      document.documentElement.dataset.bootPanel=id;
    }catch(e){document.documentElement.dataset.bootPanel='timestamp'}
  })();
  </script>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="bg-grid"></div></div>
  <header class="site-header">
    <div class="header-row">
      <div class="header-brand-block">
        <a class="brand" href="./"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">DevTools</span></a>
        <span class="tool-ver site-tools-ver mono" id="site-tools-version">v2026.09.06-083100</span>
      </div>
      <div class="header-actions">
        <button type="button" class="ghost-btn" id="site-force-refresh">强制刷新</button>
        <button type="button" class="ghost-btn" id="theme-open">主题</button>
        <button type="button" class="ghost-btn" id="header-more-toggle">更多</button>
        <button type="button" class="nav-menu-btn" id="nav-open">工具</button>
      </div>
    </div>
    <p class="tagline">常用开发小工具合集 · 本地处理不上传 · 单工具工作台</p>
  </header>
  <div class="app-layout">
    <div class="nav-backdrop" id="nav-backdrop" hidden></div>
    <aside class="nav-bar" id="nav-bar" role="navigation" aria-label="工具导航">
      <div class="nav-drawer-head"><strong>选择工具</strong><button type="button" class="ghost-btn" id="nav-close">关闭</button></div>
      <input id="tool-search" class="nav-search" type="search" placeholder="搜索工具…" />
      <div class="nav-bar-scroll" id="nav-bar-scroll">
        <div id="tool-recent" hidden></div>
        <div id="tool-favorites"></div>
        <nav class="tool-nav" id="tool-nav"></nav>
      </div>
    </aside>
    <main class="shell">
      <div class="workspace-top" id="workspace-top">
        <div class="workspace-tool-meta">
          <h1 class="workspace-title" id="workspace-title">工具</h1>
          <div class="workspace-tool-actions">
            <button type="button" class="ghost-btn" id="workspace-share">分享</button>
            <button type="button" class="ghost-btn workspace-switch" id="workspace-switch">切换工具</button>
          </div>
        </div>
      </div>
      <div id="workspace-panels" class="workspace-panels"></div>
    </main>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script src="./lib/bridge-token.js?v=2026.09.06-083100"></script>
  <script src="./lib/unified-bridge-bundle.js?v=2026.09.06-083100"></script>
  <script src="./lib/bridge-shell.js?v=2026.09.06-083100"></script>
  <script src="./lib/tool-registry.js?v=2026.09.06-083100"></script>
  <script src="./lib/nav-scale.js?v=2026.09.06-083100"></script>
  <script src="./lib/lazy-scripts.js?v=2026.09.06-083100"></script>
  <script src="./lib/panel-loader.js?v=2026.09.06-083100"></script>
  <script src="./theme.js?v=2026.09.06-083100"></script>
  <script src="./app.js?v=2026.09.06-083100"></script>
</body>
</html>
