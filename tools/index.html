  <script>
    (function () {
      try {
        var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
        if (standalone) document.documentElement.classList.add("is-pwa-standalone");
      } catch (e) {}
    })();
  </script>
  <script src="./lib/tools-build.js?v=2026.09.06-083100"></script>

  <script src="./lib/boot-loader.js?v=2026.09.06-083100"></script>
  <script>
    (function () {
      try {
        var raw = String(location.hash || "").replace(/^#/, "").trim();
        var head = raw.split(/[/?]/).filter(Boolean)[0] || "";
        var last = localStorage.getItem("devtools-tool-last-v1") || sessionStorage.getItem("devtools-tool-last-session-v1");
        var id = "timestamp";
        if (head === "media") id = raw.split("/").filter(Boolean)[1] || last || "gifmaker";
        else if (head && head !== "timestamp") id = head;
        else if (last && last !== "timestamp") id = last;
        document.documentElement.dataset.bootPanel = id;
      } catch (e) {
        document.documentElement.dataset.bootPanel = "timestamp";
      }
    })();
  </script>

        </div>

  <div class="toast" id="toast" hidden></div>
