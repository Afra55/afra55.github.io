<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1320" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>DevTools · 本地实用小工具合集</title>
  <script>try{if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)document.documentElement.classList.add('is-pwa-standalone')}catch(e){}</script>
  <script src="./lib/tools-build.js?v=2026.09.06-084000"></script>
  <link rel="stylesheet" href="./style.css?v=2026.09.06-084000" />
  <link rel="stylesheet" href="./workspace-nav.css?v=2026.09.06-084000" />
  <script src="./lib/theme-presets.js?v=2026.09.06-084000"></script>
  <script src="./lib/boot-loader.js?v=2026.09.06-084000"></script>
  <script>
  (function(){try{var raw=String(location.hash||'').replace(/^#/,'').trim();var head=raw.split(/[/?]/)[0]||'';var last=localStorage.getItem('devtools-tool-last-v1');var id='timestamp';if(head&&head!=='timestamp')id=head;else if(last&&last!=='timestamp')id=last;document.documentElement.dataset.bootPanel=id;}catch(e){document.documentElement.dataset.bootPanel='timestamp'}})();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-row">
      <a class="brand" href="./"><span class="brand-mark"></span><span class="brand-name">DevTools</span></a>
      <span class="tool-ver" id="site-tools-version">v2026.09.06-084000</span>
      <button type="button" class="ghost-btn" id="site-force-refresh">强制刷新</button>
      <button type="button" class="ghost-btn" id="theme-open">主题</button>
      <button type="button" class="ghost-btn" id="header-more-toggle">更多</button>
      <button type="button" class="nav-menu-btn" id="nav-open">工具</button>
    </div>
  </header>
  <div class="app-layout">
    <div class="nav-backdrop" id="nav-backdrop" hidden></div>
    <aside class="nav-bar" id="nav-bar">
      <div class="nav-drawer-head"><strong id="nav-drawer-title">选择工具</strong><button type="button" id="nav-close">关闭</button></div>
      <input id="tool-search" class="nav-search" type="search" placeholder="搜索工具…" />
      <input id="nav-compact" type="checkbox" />
      <div id="nav-bar-scroll">
        <div id="tool-recent" hidden></div>
        <div id="tool-favorites"><p id="tool-fav-title">常用</p><button type="button" id="tool-fav-add">+</button><div id="tool-fav-picker" hidden></div><div id="tool-fav-list"></div></div>
        <nav class="tool-nav" id="tool-nav"></nav>
      </div>
      <p id="nav-cache-meta"></p>
      <button type="button" id="nav-organize-open">整理</button>
      <button type="button" id="nav-cache-clear">清理缓存</button>
      <button type="button" id="nav-reset">默认</button>
    </aside>
    <main class="shell">
      <div id="workspace-top" class="workspace-top">
        <h1 class="workspace-title" id="workspace-title">工具</h1>
        <button type="button" id="workspace-share">分享</button>
        <button type="button" class="workspace-switch" id="workspace-switch">切换工具</button>
        <div id="category-subnav" hidden></div>
      </div>
      <div id="workspace-panels" class="workspace-panels">
        <div id="devtools-tool-load" hidden><span class="devtools-tool-load-fill"></span><p id="devtools-tool-load-label" hidden></p></div>
      </div>
    </main>
  </div>
  <div id="toast" hidden></div>
  <div id="header-more-menu" hidden></div>
  <div id="theme-dlg" hidden></div>
  <div id="theme-presets"></div>
  <button type="button" id="theme-close" hidden></button>
  <button type="button" id="theme-reset" hidden></button>
  <script src="./lib/tool-registry.js?v=2026.09.06-084000"></script>
  <script src="./lib/nav-scale.js?v=2026.09.06-084000"></script>
  <script src="./lib/lazy-scripts.js?v=2026.09.06-084000"></script>
  <script src="./lib/panel-loader.js?v=2026.09.06-084000"></script>
  <script src="./theme.js?v=2026.09.06-084000"></script>
  <script src="./app.js?v=2026.09.06-084000"></script>
</body>
</html>
